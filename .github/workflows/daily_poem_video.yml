name: Daily Poem Video Generator

on:
  schedule:
    # 每天北京时间早上 08:00 运行 (对应 UTC 时间 0:00)
    - cron: '0 0 * * *'
  workflow_dispatch: # 允许在 GitHub Web 界面手动点击运行测试

permissions:
  contents: write # 给予机器人写回 history.json 的权限

jobs:
  build-and-send:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install System Dependencies (FFmpeg & Chinese Fonts)
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg fonts-wqy-zenhei fonts-wqy-microhei

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Poem Video Generator
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
        TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
      run: |
        python main.py

    - name: Auto Commit Updated history.json
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add history.json
        git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update poem history [skip ci]" && git push)
