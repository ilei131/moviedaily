name: Daily Poem Video Generator

on:
  workflow_dispatch: # 手动触发

permissions:
  contents: write # 给予机器人写回 history.json 的权限

jobs:
  build-and-send:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install System Dependencies (FFmpeg, Chinese Fonts & ImageMagick)
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg fonts-wqy-zenhei fonts-wqy-microhei imagemagick
        sudo sed -i 's/<policy domain="path" rights="none" pattern="@\*"/<!-- & -->/' /etc/ImageMagick-6/policy.xml 2>/dev/null || true

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Poem Video Generator
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
        TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        TG_CHANNEL_ID: ${{ secrets.TG_CHANNEL_ID }}
        HF_TOKEN: ${{ secrets.HF_TOKEN }}
        PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      run: |
        python main.py

    - name: Upload Video as Artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: daily-poem-video
        path: "*.mp4"
        retention-days: 7

    - name: Auto Commit Updated history.json
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add history.json
        git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update poem history [skip ci]" && git push)